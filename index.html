<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>My Notes</h1>
        <p>Save and manage your notes</p>
    </header>


    <!-- Note Form -->

    <section class="note-form">

        <input
            type="text"
            id="title"
            placeholder="Note title"
        >

        <textarea
            id="content"
            placeholder="Type your note here..."
        ></textarea>


        <div class="form-buttons">

            <button
                id="saveButton"
                onclick="saveNote()"
            >
                Save Note
            </button>

            <button
                id="cancelButton"
                class="cancel-button"
                onclick="cancelEdit()"
                style="display:none;"
            >
                Cancel
            </button>

        </div>


        <p id="message"></p>

    </section>



    <!-- Saved Notes -->

    <section class="notes-section">

        <div class="section-header">

            <h2>Saved Notes</h2>

            <input
                type="text"
                id="search"
                placeholder="Search notes..."
                oninput="displayNotes()"
            >

        </div>


        <div id="notesContainer">
            Loading notes...
        </div>

    </section>

</div>



<script>

let notes = [];
let editingId = null;


// ===============================
// Load notes
// ===============================

async function loadNotes() {

    try {

        const response = await fetch("/api/notes");

        if (!response.ok) {
            throw new Error("Unable to load notes");
        }

        notes = await response.json();

        displayNotes();

    } catch (error) {

        console.error(error);

        document.getElementById("notesContainer").innerHTML =
            "<p>Unable to load notes.</p>";

    }
}



// ===============================
// Display notes
// ===============================

function displayNotes() {

    const container =
        document.getElementById("notesContainer");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();


    const filteredNotes = notes.filter(note =>

        note.title.toLowerCase().includes(search) ||

        note.content.toLowerCase().includes(search)

    );


    if (filteredNotes.length === 0) {

        container.innerHTML =
            "<p class='no-notes'>No notes found.</p>";

        return;

    }


    container.innerHTML = filteredNotes.map(note => `

        <div class="note-card">

            <h3>${escapeHTML(note.title)}</h3>

            <p>${escapeHTML(note.content)}</p>

            <small>
                Created:
                ${formatDate(note.created_at)}
            </small>


            <div class="note-actions">

                <button
                    class="edit-button"
                    onclick="editNote(${note.id})"
                >
                    Edit
                </button>


                <button
                    class="delete-button"
                    onclick="deleteNote(${note.id})"
                >
                    Delete
                </button>

            </div>

        </div>

    `).join("");

}



// ===============================
// Save / Update note
// ===============================

async function saveNote() {

    const title =
        document.getElementById("title")
        .value
        .trim();


    const content =
        document.getElementById("content")
        .value
        .trim();


    const message =
        document.getElementById("message");


    if (!title || !content) {

        message.textContent =
            "Please enter both title and note.";

        return;

    }


    try {

        let response;


        // =========================
        // Update existing note
        // =========================

        if (editingId !== null) {

            response = await fetch(
                `/api/notes/${editingId}`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title: title,
                        content: content
                    })

                }
            );

        }


        // =========================
        // Create new note
        // =========================

        else {

            response = await fetch(
                "/api/notes",
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title: title,
                        content: content
                    })

                }
            );

        }


        if (!response.ok) {

            throw new Error("Save failed");

        }


        // Clear form

        document.getElementById("title").value = "";

        document.getElementById("content").value = "";


        // Reset editing state

        editingId = null;


        // Reset button

        document.getElementById("saveButton")
            .textContent = "Save Note";


        document.getElementById("cancelButton")
            .style.display = "none";


        message.textContent =
            "Note saved successfully!";


        await loadNotes();


        setTimeout(() => {

            message.textContent = "";

        }, 2000);


    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to save note.";

    }

}



// ===============================
// Start editing
// ===============================

function editNote(id) {

    const note =
        notes.find(note => note.id === id);


    if (!note) {
        return;
    }


    document.getElementById("title")
        .value = note.title;


    document.getElementById("content")
        .value = note.content;


    editingId = id;


    document.getElementById("saveButton")
        .textContent = "Update Note";


    document.getElementById("cancelButton")
        .style.display = "inline-block";


    document.getElementById("title")
        .focus();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



// ===============================
// Cancel editing
// ===============================

function cancelEdit() {

    editingId = null;


    document.getElementById("title")
        .value = "";


    document.getElementById("content")
        .value = "";


    document.getElementById("saveButton")
        .textContent = "Save Note";


    document.getElementById("cancelButton")
        .style.display = "none";


    document.getElementById("message")
        .textContent = "";

}



// ===============================
// Delete note
// ===============================

async function deleteNote(id) {

    if (!confirm(
        "Are you sure you want to delete this note?"
    )) {

        return;

    }


    try {

        const response = await fetch(
            `/api/notes/${id}`,
            {
                method: "DELETE"
            }
        );


        if (!response.ok) {

            throw new Error("Delete failed");

        }


        // If deleting the note currently being edited

        if (editingId === id) {

            cancelEdit();

        }


        await loadNotes();


    } catch (error) {

        console.error(error);

        alert("Unable to delete note.");

    }

}



// ===============================
// Format date
// ===============================

function formatDate(date) {

    return new Date(date)
        .toLocaleString();

}



// ===============================
// Security helper
// ===============================

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



// ===============================
// Initial load
// ===============================

loadNotes();

</script>

</body>
</html>
